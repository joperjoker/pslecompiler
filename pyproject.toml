[project]
name = "pslecompiler"
version = "0.1.0"
description = "PSLE syllabus second-brain: ingests MOE syllabi into a Neo4j knowledge graph (structured spine + wiki synthesis + GraphRAG) for generating MCQ question banks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pymupdf>=1.24",        # PDF parsing (import name: fitz)
    "networkx>=3.2",        # in-memory graph backend + community detection
    "httpx>=0.27",          # optional Neo4j HTTP Query API client
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Vector layer. Blocked behind a network policy in some environments
# (huggingface.co egress), hence kept optional. Install when network allows.
embeddings = [
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pslecompiler = "pslecompiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pslecompiler"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
